services:
  postgres:
    image: postgres:15-alpine
    container_name: mas-postgres
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    ports:
      - "5434:5432"  # host 5434 -> container 5432 (5432 and 5433 already taken locally)
    volumes:
      - mas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mas-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI

  # OTel collector. Built from infra/otel-collector/Dockerfile so the config
  # is baked into the image — bind mounts fail because the repo path
  # contains ':' (`(21-04-2026 15:16)`), which Docker's volume parser rejects.
  otel-collector:
    build:
      context: ./infra/otel-collector
    container_name: mas-otel
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP

  # Mock OIDC provider for local dev. Issues tokens with email/name/hd
  # claims matching the seeded `acme.test` tenant.
  oidc-mock:
    build:
      context: ./infra/oidc-mock
    container_name: mas-oidc-mock
    ports:
      - "9000:8080"
    environment:
      SERVER_PORT: "8080"

volumes:
  mas-pgdata:
