services:
  postgres:
    image: postgres:15-alpine
    container_name: mas-postgres
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    ports:
      - "5434:5432"  # host 5434 -> container 5432 (5432 and 5433 already taken locally)
    volumes:
      - mas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: mas-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI

  # otel-collector is disabled until W9. The Docker daemon rejects bind mounts
  # whose source path contains ':' (this repo lives under a dir with '15:16'
  # in the name). When W9 wires up OTel we'll switch to a custom image that
  # bakes the config in via Dockerfile COPY:
  #
  #   infra/otel-collector/Dockerfile:
  #     FROM otel/opentelemetry-collector-contrib:0.110.0
  #     COPY otel-collector-config.yaml /etc/otelcol-contrib/config.yaml
  #
  # otel-collector:
  #   build: ./infra/otel-collector
  #   container_name: mas-otel
  #   ports:
  #     - "4317:4317"
  #     - "4318:4318"

volumes:
  mas-pgdata:
